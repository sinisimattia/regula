# Minimal self-hosting stack. Point DB_HOST at a managed Postgres instance and skip the
# `database` profile if you don't want to run Postgres in a container.
#
# First run:
#   cp .env.example .env && edit it (APP_KEY, DB_*, ...)
#   docker compose -f compose.production.yml --profile database up -d --build
#   docker compose -f compose.production.yml exec app php artisan migrate --force --isolated
#
# Queues: with QUEUE_DRIVER=sqs each logical connection (default, high, low,
# default-ordered) is its own SQS queue, so run one worker per connection
# (`queue:work high`, `queue:work low`, ...). With QUEUE_DRIVER=database or redis a single
# worker serves all four, which is what the `worker` service below does by default.

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: production
        env_file: .env
        volumes:
            - storage:/var/www/storage/app
        networks:
            - app-network
        restart: unless-stopped

    web:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: web
        env_file: .env
        ports:
            - "${APP_PORT:-80}:80"
        networks:
            - app-network
        depends_on:
            - app
        restart: unless-stopped

    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: production
        env_file: .env
        command: php artisan queue:work default --queue=high,default,default-ordered,low --sleep=3
        volumes:
            - storage:/var/www/storage/app
        networks:
            - app-network
        restart: unless-stopped

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: production
        env_file: .env
        command: php artisan schedule:work
        volumes:
            - storage:/var/www/storage/app
        networks:
            - app-network
        restart: unless-stopped

    # Only needed for self-hosted Postgres — omit --profile database to use a managed instance.
    db:
        image: postgres:17-alpine
        profiles: ["database"]
        environment:
            POSTGRES_USER: ${DB_USERNAME:-app}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE:-app}
        volumes:
            - db-data:/var/lib/postgresql/data
        networks:
            - app-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-app}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

networks:
    app-network:
        driver: bridge

volumes:
    # Persists user uploads (the `local` filesystem disk) across rebuilds. Logs go to stdout in
    # production (LOG_CHANNEL=stack picks up docker's log driver), so no separate volume for those.
    storage:
        driver: local
    db-data:
        driver: local
