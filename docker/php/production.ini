; Production overrides. Keeps the memory/upload limits from docker/php/php.ini (the dev
; bind-mount doesn't apply here — this stage bakes its own config in), turns opcache all the
; way on, and hides the PHP version from response headers.
memory_limit = 512M
upload_max_filesize = 30M
post_max_size = 30M
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128
